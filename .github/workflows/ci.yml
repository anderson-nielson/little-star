# Roda em toda pull request para main: a rodada só entra se lint, teste e
# build passarem. É a mesma sequência que o pages.yml repete antes de publicar,
# então uma PR verde aqui é uma publicação que não vai quebrar lá.
name: Conferir a rodada

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conferir:
    name: Lint, teste e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
